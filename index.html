<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Diario IA - PWA Modular</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4a6fa5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/modules.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">🤖</span>
                <h1>Asistente Diario IA</h1>
            </div>
            <button class="menu-toggle" id="menuToggle">☰</button>
            <nav>
                <ul id="navMenu">
                    <li><a href="#" class="nav-link" data-module="inicio">Inicio</a></li>
                    <!-- Los módulos se cargarán dinámicamente aquí -->
                </ul>
            </nav>
        </div>
    </header>

    <main id="main-content">
        <!-- El contenido se cargará dinámicamente -->
        <div id="loading" class="loading-container">
            <div class="loading-spinner"></div>
            <p>Cargando módulos...</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Asistente Diario IA - Aplicación SERGEXA</p>
    </footer>

    <!-- Scripts -->
    <script src="assets/js/core/moduleManager.js"></script>
    <script src="assets/js/core/router.js"></script>
    <script src="assets/js/core/storage.js"></script>
    <script src="assets/js/app.js"></script>
    
    <!-- Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('Service Worker registrado'))
                .catch(err => console.log('Error SW:', err));
        }
    </script>
</body>
</html>
